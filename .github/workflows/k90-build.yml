name: k90-build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: k90-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  kernel:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - name: Checkout kernel at pinned commit
        uses: actions/checkout@v4
        with:
          repository: iola1999/hackios-xnu-kernel
          ref: 4cd05c997e80d2162ff0013dbff82fe0c2e695cc
          path: kernel
          submodules: false
          fetch-depth: 1

      - name: Show toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          xcode-select -p
          xcrun --sdk iphoneos --show-sdk-path
          sw_vers

      - name: Install GNU make
        run: |
          set -euo pipefail
          brew install make
          gmake --version

      - name: Provide nproc on macOS
        run: |
          set -euo pipefail
          printf '#!/bin/sh\nsysctl -n hw.ncpu\n' | sudo tee /usr/local/bin/nproc >/dev/null
          sudo chmod +x /usr/local/bin/nproc
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          nproc

      - name: Apply XNU 12377 patches
        working-directory: kernel
        env:
          XNU26_SRC: ${{ github.workspace }}/kernel/out/xnu12377
        run: |
          set -euo pipefail
          xnu26/apply.sh

      - name: Fetch macOS build dependencies
        working-directory: kernel
        env:
          XNU26_SRC: ${{ github.workspace }}/kernel/out/xnu12377
        run: |
          set -euo pipefail
          xnu26/deps-macos.sh

      - name: Export kernel headers
        working-directory: kernel
        env:
          XNU26_SRC: ${{ github.workspace }}/kernel/out/xnu12377
        run: |
          set -euo pipefail
          MAKE=gmake xnu26/build-macos.sh exporthdrs installhdrs

      - name: Build stage-2 kernel libraries
        working-directory: kernel
        env:
          XNU26_SRC: ${{ github.workspace }}/kernel/out/xnu12377
        run: |
          set -euo pipefail
          xnu26/deps-macos.sh --stage2

      - name: Build 12377 kernel
        working-directory: kernel
        env:
          XNU26_SRC: ${{ github.workspace }}/kernel/out/xnu12377
        run: |
          set -euo pipefail
          MAKE=gmake xnu26/build-macos.sh -j4 BUILD_DSYM=0 2>&1 | tee build-kernel.log

      - name: Collect kernel artifact
        run: |
          set -euo pipefail
          mkdir -p artifacts
          KERNEL="kernel/out/xnu12377/BUILD/obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837"
          test -f "$KERNEL"
          cp "$KERNEL" artifacts/mach.development.bcm2837
          shasum -a 256 artifacts/mach.development.bcm2837 | tee artifacts/SHA256SUMS
          printf 'source_commit=4cd05c997e80d2162ff0013dbff82fe0c2e695cc\n' >> artifacts/BUILD-INFO.txt
          printf 'runner=%s\n' "$ImageOS" >> artifacts/BUILD-INFO.txt
          xcodebuild -version >> artifacts/BUILD-INFO.txt
          cp kernel/build-kernel.log artifacts/build-kernel.log

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: k90-kernel-12377
          path: artifacts
          if-no-files-found: error
          retention-days: 7

  bootimg:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout kernel at pinned commit
        uses: actions/checkout@v4
        with:
          repository: iola1999/hackios-xnu-kernel
          ref: 4cd05c997e80d2162ff0013dbff82fe0c2e695cc
          path: kernel
          submodules: false
          fetch-depth: 1

      - name: Checkout top workspace for the annibale DTB
        uses: actions/checkout@v4
        with:
          repository: iola1999/hackios-redmi-k90-annibale
          ref: f36fc12afe2c
          path: top
          submodules: false
          fetch-depth: 1

      - name: Install UEFI build tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld nasm python3 git
          clang --version
          ld.lld --version

      - name: Prepare Mu-Silicium and redwood patch
        working-directory: kernel
        run: |
          set -euo pipefail
          uefi/apply.sh

      - name: Pack loader-only smoke boot image
        working-directory: kernel
        env:
          CC: clang
          UEFI_TARGET: annibale
          UEFI_FD: ${{ github.workspace }}/kernel/prebuilt/uefi/annibale-smoke-dodgefv.fd
          DTB: ${{ github.workspace }}/top/docs/analysis/data/annibale.fdt
          FD_BASE: "0xA7100000"
          FD_SIZE: "0x300000"
          PAYLOAD_BASE: "0xF0000000"
          PAYLOAD_CAP: "0x03700000"
        run: |
          set -euo pipefail
          mkdir -p out
          python3 mkxnuimg.py -o out/loader-smoke.img
          test -s out/loader-smoke.img

      - name: Collect boot image artifact
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp kernel/out/loader-smoke.img artifacts/loader-smoke.img
          shasum -a 256 artifacts/loader-smoke.img | tee artifacts/SHA256SUMS
          printf 'source_commit=4cd05c997e80d2162ff0013dbff82fe0c2e695cc\n' >> artifacts/BUILD-INFO.txt
          printf 'uefi=annibale-smoke-dodgefv.fd (smoke, not final)\n' >> artifacts/BUILD-INFO.txt
          printf 'dtb=docs/analysis/data/annibale.fdt 911637 bytes\n' >> artifacts/BUILD-INFO.txt
          printf 'purpose=loader enumeration only; no kernel or iOS images\n' >> artifacts/BUILD-INFO.txt

      - name: Upload smoke boot image
        uses: actions/upload-artifact@v4
        with:
          name: k90-loader-smoke-img
          path: artifacts
          if-no-files-found: error
          retention-days: 7

  loader:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout kernel at pinned commit
        uses: actions/checkout@v4
        with:
          repository: iola1999/hackios-xnu-kernel
          ref: 4cd05c997e80d2162ff0013dbff82fe0c2e695cc
          path: kernel
          submodules: false
          fetch-depth: 1

      - name: Install LLVM and LLD
        run: |
          set -euo pipefail
          brew install llvm lld
          LLVM="$(brew --prefix llvm)/bin"
          LLD="$(brew --prefix lld)/bin"
          echo "$LLVM" >> "$GITHUB_PATH"
          echo "$LLD" >> "$GITHUB_PATH"
          "$LLVM/clang" --version
          "$LLD/lld-link" --version

      - name: Build phone loader
        working-directory: kernel/xnuloader
        env:
          EXTRA_CFLAGS: -DDIRECT_PHONE_PLAT
          BUILD_ID: 4cd05c997e80d2162ff0013dbff82fe0c2e695cc
        run: |
          set -euo pipefail
          bash build.sh

      - name: Collect loader artifact
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp kernel/xnuloader/loader-phone.efi artifacts/loader-phone.efi
          shasum -a 256 artifacts/loader-phone.efi | tee artifacts/SHA256SUMS
          printf 'source_commit=4cd05c997e80d2162ff0013dbff82fe0c2e695cc\n' >> artifacts/BUILD-INFO.txt
          printf 'build_id=4cd05c997e80d2162ff0013dbff82fe0c2e695cc\n' >> artifacts/BUILD-INFO.txt

      - name: Upload loader artifact
        uses: actions/upload-artifact@v4
        with:
          name: k90-loader-phone
          path: artifacts
          if-no-files-found: error
          retention-days: 7
